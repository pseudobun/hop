name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build and test
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Xcode version
        run: xcodebuild -version

      - name: Test
        run: scripts/build-local.sh test

      - name: Release build (ad-hoc)
        run: |
          scripts/release-build.sh
          app=build.noindex/release/hop.app
          lipo -archs "$app/Contents/MacOS/hop"
          "$app/Contents/MacOS/hop" version
          test "$(defaults read "$PWD/$app/Contents/Info" CFBundleIdentifier)" = com.pseudobun.hop

      - name: Config templates match examples/
        run: |
          hop=build.noindex/release/hop.app/Contents/MacOS/hop
          "$hop" config template | diff -u examples/config.json5 -
          "$hop" snippets template | diff -u examples/snippets.json5 -

      - name: Check the cask template
        run: ruby -c packaging/hop.rb.template

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git --redact --no-banner -v .
