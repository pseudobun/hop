name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # What a pull request touches, so the macOS jobs run only when they can find something.
  # Pushes and manual runs build everything. A skipped job counts as passed for required checks.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.files.outputs.app }}
      sdk: ${{ steps.files.outputs.sdk }}
    steps:
      - id: files
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ -z "$PR" ]; then
            echo "app=true" >> "$GITHUB_OUTPUT"; echo "sdk=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          files=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate --jq '.[].filename')
          echo "$files"
          app=false; sdk=false
          while IFS= read -r f; do
            case "$f" in
              .github/workflows/*) app=true; sdk=true ;;
              sdk/*|examples/plugins/*) sdk=true ;;
              docs/*|*.md|LICENSE|favicon.svg) ;;
              *) app=true ;;
            esac
          done <<< "$files"
          echo "app=$app" >> "$GITHUB_OUTPUT"; echo "sdk=$sdk" >> "$GITHUB_OUTPUT"
          echo "app: $app, sdk: $sdk"

  build-test:
    name: Build and test
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable

      - name: Xcode version
        run: xcodebuild -version

      - name: Test
        run: scripts/build-local.sh test

      - name: Release build (ad-hoc)
        run: |
          scripts/release-build.sh
          app=build.noindex/release/hop.app
          lipo -archs "$app/Contents/MacOS/hop"
          "$app/Contents/MacOS/hop" version
          test "$(defaults read "$PWD/$app/Contents/Info" CFBundleIdentifier)" = com.pseudobun.hop

      - name: Config templates match examples/
        run: |
          hop=build.noindex/release/hop.app/Contents/MacOS/hop
          "$hop" config template | diff -u examples/config.json5 -
          "$hop" snippets template | diff -u examples/snippets.json5 -

      - name: Check the cask template
        run: ruby -c packaging/hop.rb.template

  plugin-sdks:
    name: Plugin SDKs and examples
    needs: changes
    if: needs.changes.outputs.sdk == 'true'
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable

      - name: Swift SDK
        run: swift test --package-path sdk/swift

      - name: Rust SDK
        run: cargo test --manifest-path sdk/rust/hop-plugin/Cargo.toml

      - name: Example plugins pack
        run: |
          examples/plugins/hello-rust/pack.sh
          examples/plugins/hello-swift/pack.sh
          unzip -l examples/plugins/hello-rust/dev.hop.hello-rust.hopplugin.zip
          unzip -l examples/plugins/hello-swift/dev.hop.hello-swift.hopplugin.zip

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git --redact --no-banner -v .
